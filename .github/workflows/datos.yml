name: Datos diarios

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 en Buenos Aires, antes del informe de las 8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos
        run: python scripts/descargar.py
      - name: Guardar cambios
        run: |
          git config user.name "laboratorio-cripto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%d)"
          git push
